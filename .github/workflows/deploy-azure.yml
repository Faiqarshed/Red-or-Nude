# Deploys to Azure App Service on every push to `staging`, into the `staging`
# slot of the ron-prod Web App. Production (`main`) is added once its settings exist.
#
# The app is built here, on GitHub's runner, not on the App Service VM: the VM
# has one CPU shared with the live slots, and building there took ~24 minutes.
# `next build` writes a self-contained server to .next/standalone
# (output: "standalone" in next.config.mjs); that folder, plus public/ and
# .next/static, is all that ships. Azure only unzips it and restarts.
#
# No secrets are needed to build: every page renders on request, so nothing
# touches the database until the app is running on Azure.
#
# Database migrations are NOT run here: run them by hand before merging a change
# that adds a file under drizzle/.
#
# Signs in as the `redornude-deploy` managed identity through GitHub's OIDC
# token; it only trusts this repo's `staging` and `production` environments.

name: Deploy to Azure

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Production and staging share one S1 VM, so never deploy two at once.
concurrency:
  group: azure-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  staging:
    # The old personal repo (still feeding Vercel) skips this instead of failing.
    if: github.repository == 'Dahna-OG/red-or-nude' && github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://ron-prod-staging.azurewebsites.net
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Next.js reuses its compile cache between builds; only changed files
      # are compiled again.
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'middleware.ts', 'next.config.mjs', 'tailwind.config.ts') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # The standalone server leaves public/ and .next/static to a CDN by
      # default; App Service has none, so they go in next to server.js.
      - name: Package
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          (cd .next/standalone && zip -qry "$GITHUB_WORKSPACE/ron-app.zip" .)
          ls -lh ron-app.zip

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The bundle is already built, so Azure must not build it again, and it
      # starts with server.js rather than `npm start`. HOSTNAME is pinned because
      # the container sets its own, and server.js would listen only on that.
      # Each setting is only written when it differs: writing restarts the slot.
      - name: Make the slot run the bundle as-is
        run: |
          app="-g rg-redornude-prod -n ron-prod --slot staging"
          build=$(az webapp config appsettings list $app \
            --query "[?name=='SCM_DO_BUILD_DURING_DEPLOYMENT'].value | [0]" -o tsv)
          if [ "$build" != "false" ]; then
            az webapp config appsettings set $app \
              --slot-settings SCM_DO_BUILD_DURING_DEPLOYMENT=false -o none
          fi
          start="HOSTNAME=0.0.0.0 node server.js"
          if [ "$(az webapp config show $app --query appCommandLine -o tsv)" != "$start" ]; then
            az webapp config set $app --startup-file "$start" -o none
          fi

      # --clean wipes what the old on-VM builds left behind (node_modules and
      # its compressed copy), which the Node image would otherwise unpack over
      # the bundle at startup.
      - name: Deploy to staging slot
        run: |
          az webapp deploy \
            -g rg-redornude-prod -n ron-prod --slot staging \
            --src-path ron-app.zip --type zip --clean true --async true

      - name: Wait for the deploy to finish
        run: |
          site=$(az webapp show -g rg-redornude-prod -n ron-prod --query id -o tsv)
          api="https://management.azure.com${site}/slots/staging/deployments"
          v="api-version=2022-03-01"
          sleep 15
          id=$(az rest --method get --url "$api?$v" \
            --query "sort_by(value, &properties.start_time)[-1].name" -o tsv)
          id=${id##*/}
          echo "Deployment $id"
          # 4 = deployed; anything else is still going. Unzipping takes a minute
          # or two, so ten minutes means something is wrong.
          for i in $(seq 1 40); do
            status=$(az rest --method get --url "$api/$id?$v" --query properties.status -o tsv)
            echo "$(date -u +%H:%M:%S) status=$status"
            [ "$status" = "4" ] && exit 0
            sleep 15
          done
          az rest --method get --url "$api/$id/log?$v" \
            --query "value[].properties.message" -o tsv | tail -40
          exit 1
